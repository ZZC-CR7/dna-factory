<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1822">
  <title>AI 蛋白质工厂 · 互动分子实验室</title>
  <meta name="description" content="在三维教学车间定制一批荧光示踪蛋白，操作设计、生产、分离、质检与交付工位。">
  <link rel="stylesheet" href="apps.css?v=plant-1">
  <script defer src="three.min.js"></script>
  <script defer src="factory-machines.js"></script>
  <script defer src="factory-view.js"></script>
  <script defer src="apps.js?v=plant-1"></script>
</head>
<body>
  <a class="skip-link" href="#stationTitle">跳至工位操作</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="基因解码首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>基因解码</span>
      </a>
      <span class="breadcrumb">互动分子实验室 <i aria-hidden="true">/</i> 工程应用</span>
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> 返回原理演示</a>
    </div>
  </header>

  <main>
    <header class="page-heading">
      <div class="intro">
        <h1><span>AI</span> 蛋白质工厂</h1>
        <p>定制一批荧光示踪蛋白，沿着生产线完成设计、制备和交付。</p>
      </div>
      <div class="mode-actions">
        <button id="demoButton" type="button" class="demo-button">自动演示</button>
        <button id="resetButton" type="button" class="reset-button">重新开单</button>
      </div>
    </header>

    <div class="console-layout">
      <section class="line-panel" aria-label="互动产线">
        <div class="panel-bar">
          <h2><i class="view-icon" aria-hidden="true"></i> 三维产线</h2>
          <div class="view-actions">
            <span id="viewLabel">全厂视野</span>
            <button id="overviewButton" type="button">查看全景</button>
          </div>
        </div>
        <div class="viewport-wrap">
          <div id="factoryView" aria-label="蛋白质工厂互动视野"></div>
        </div>
        <div class="view-help">选择工位查看设备 <span aria-hidden="true">·</span> 拖动旋转 <span aria-hidden="true">·</span> 滚轮或双指缩放</div>
        <nav id="stationNav" aria-label="选择产线工位"></nav>
      </section>

      <section class="control-panel" aria-labelledby="stationTitle">
        <div class="batch-head">
          <div class="batch-meta"><span class="batch-caption">生产批次</span><b id="batchLabel">待开单</b></div>
          <div class="progress-meta"><span>批次进度</span><b id="progressLabel">0 / 5</b></div>
          <div class="progress-track" aria-hidden="true"><div id="progressFill"></div></div>
        </div>
        <div class="station-content">
          <div class="station-step" id="stationIndex">工位 01 / 05</div>
          <h2 id="stationTitle" tabindex="-1">AI 设计台</h2>
          <p id="stationDescription">选择订单所需的荧光颜色，查看候选模型。</p>
          <div id="stationControl"></div>
        </div>
        <div class="action-block">
          <button type="button" id="actionButton">确认订单</button>
          <p id="statusText" role="status" aria-live="polite" aria-atomic="true"></p>
        </div>
      </section>
    </div>

    <section id="resultPanel" class="report" aria-label="本批次交付记录" hidden></section>
    <noscript><p class="noscript">请启用浏览器的 JavaScript 以操作产线。</p></noscript>
  </main>
  <footer>
    <span>本场景采用教学示意模型和模拟质检数据。</span>
    <a href="references.html">前沿文献资料 <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
