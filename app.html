<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111c">
  <title>基因编辑 · 应用场景实验室</title>
  <link rel="stylesheet" href="apps.css">
</head>
<body>
  <header class="apps-top">
    <a class="apps-brand" href="index.html"><span class="apps-mark">M</span><span><b>分子实验室</b><small>应用场景 · 工程场景数字化</small></span></a>
    <a class="apps-back" href="index.html">← 返回原理演示</a>
  </header>

  <main class="app-shell">
    <!-- Tab 1：互动场景 -->
    <section class="tab-pane active" id="tabScenes">
      <div class="scenes-intro">
        <h1>四个前沿场景，<em>动手看过程</em></h1>
        <p>把真实工程流程做成可操作的动画场景：选择场景，点击画布中<span class="hi">发光的目标</span>推进步骤，或一键自动播放。</p>
      </div>
      <div class="scene-picker" id="scenePicker"></div>

      <section class="scene-card" id="sceneCard">
        <div class="scene-head">
          <div><span class="section-kicker" id="sceneKicker">场景 01 / 04</span><h2 id="sceneTitle">红细胞贫血的基因疗法</h2></div>
          <span class="scene-source" id="sceneSource"></span>
        </div>
        <div class="canvas-wrap">
          <canvas id="sceneCanvas" aria-label="可交互的应用场景动画"></canvas>
          <div class="scene-hint" id="sceneHint">点击发光目标，推进步骤</div>
        </div>
        <div class="scene-controls">
          <button id="btnPrev" type="button">‹ 上一步</button>
          <div class="scene-dots" id="sceneDots"></div>
          <button id="btnPlay" type="button">▶ 自动播放</button>
          <button id="btnNext" type="button">下一步 ›</button>
        </div>
      </section>

      <section class="scene-info">
        <div class="scene-info-head"><span class="section-kicker">步骤说明</span><b id="stepIndex">第 1 / 6 步</b></div>
        <h3 id="stepTitle"></h3>
        <p id="stepText"></p>
        <p class="scene-meaning" id="stepMeaning"></p>
      </section>
    </section>

    <!-- Tab 2：应用速览 -->
    <section class="tab-pane" id="tabCards">
      <div class="scenes-intro">
        <h1>应用速览 · <em>17 项前沿进展</em></h1>
        <p>2020 年诺奖之后，基因编辑在各领域的落地与突破（依据公开资料整理，2023–2026）。</p>
      </div>
      <nav class="apps-tabs" id="appsTabs" aria-label="应用领域">
        <button data-cat="all" class="active" type="button">全部</button>
        <button data-cat="medical" type="button">医学治疗</button>
        <button data-cat="cell" type="button">细胞工程</button>
        <button data-cat="protein" type="button">蛋白质工程</button>
        <button data-cat="agri" type="button">农业与育种</button>
        <button data-cat="ethics" type="button">伦理与边界</button>
      </nav>
      <div class="apps-list" id="appsList"></div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="主导航">
    <button data-tab="tabScenes" class="active" type="button"><b>🧪</b><span>互动场景</span></button>
    <button data-tab="tabCards" type="button"><b>📋</b><span>应用速览</span></button>
    <a href="index.html"><b>🧬</b><span>原理演示</span></a>
  </nav>

  <footer class="apps-foot">
    <p>场景为教学示意，依据公开监管批准、临床数据与学术论文整理（2023–2026）；医疗信息仅供科普，不构成诊疗建议。</p>
  </footer>
  <script src="apps.js"></script>
</body>
</html>
