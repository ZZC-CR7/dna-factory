<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06101a">
  <title>CRISPR-Cas9 · 三维分子视野</title>
  <link rel="stylesheet" href="3d.css">
</head>
<body>
  <header class="d3-top">
    <a class="d3-brand" href="index.html"><span class="d3-mark">3D</span><span><b>分子视野</b><small>CRISPR-Cas9 · 三维演示</small></span></a>
    <nav class="d3-modes">
      <button id="modeObserve" class="active" type="button">自由观察</button>
      <button id="modeDemo" type="button">▶ 演示动画</button>
      <button id="modeReset" type="button">↺ 重置</button>
    </nav>
    <a class="d3-back" href="index.html">← 返回</a>
  </header>

  <main class="d3-stage">
    <canvas id="d3canvas" aria-label="可拖拽旋转的三维 DNA 与 Cas9 场景"></canvas>
    <div class="d3-legend">
      <span><i style="background:#67c2cc"></i>骨架链 A</span>
      <span><i style="background:#ed8178"></i>骨架链 B</span>
      <span><i style="background:#e8b875"></i>PAM 区域</span>
      <span><i style="background:#7fc9d5"></i>Cas9 蛋白</span>
      <span><i style="background:#91d0ae"></i>向导 RNA</span>
    </div>
    <div class="d3-status" id="d3status">自由观察模式</div>
    <div class="d3-repair" id="d3repair" hidden>
      <button id="repNHEJ" type="button">NHEJ · 直接连接（常致敲除）</button>
      <button id="repHDR" type="button">HDR · 供体模板精准修复</button>
    </div>
    <div class="d3-steps" id="d3steps">
      <button id="sPrev" type="button">‹</button>
      <div class="d3-dots" id="d3dots"></div>
      <button id="sNext" type="button">›</button>
      <button id="sAuto" type="button">▶ 自动播放</button>
      <button id="sReset" type="button">↺</button>
    </div>
    <div class="d3-hint">拖拽旋转 · 滚轮/双指缩放 · 点击结构查看说明</div>
  </main>

  <section class="d3-info" id="d3info">
    <div class="d3-info-head"><span class="kicker">结构检查器</span><b id="d3infoTag">点击场景中的结构</b></div>
    <h3 id="d3infoTitle">选择一个部件</h3>
    <p id="d3infoText">拖拽旋转视角，点击 DNA 骨架、碱基对、PAM 区域或 Cas9 蛋白，查看它的作用。点「▶ 自动播放」观看完整编辑流程。</p>
    <p class="d3-plain" id="d3plain"></p>
  </section>

  <footer class="d3-foot">
    <span>教学示意模型 · 非真实比例</span>
    <a href="unity/">→ Unity 引擎版</a>
    <a href="app.html">→ 应用场景实验室</a>
    <a href="index.html">→ 原理演示</a>
  </footer>
  <script src="three.min.js"></script>
  <script src="3d.js"></script>
</body>
</html>
